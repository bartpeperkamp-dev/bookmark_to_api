<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bookmark it! Settings</title>
  <style>
    body {
      font-family: sans-serif;
      min-width: 300px;
      padding: 10px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-weight: bold;
    }
    input[type="url"], input[type="password"], input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 4px;
      margin-bottom: 8px;
    }
    #status {
      color: green;
      height: 1em;
    }
  </style>
</head>
<body>
  <label for="url">URL</label>
  <input type="url" id="url" placeholder="https://example.com">

  <label for="token">Bearer Token</label>
  <input type="password" id="token" placeholder="Token" autocomplete="off">

  <button id="save">Save</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
